name: Build Wine 11.18 native WoW64 runtime

on:
  push:
    branches:
      - repair/wine1118-native-wow64
    paths:
      - '.github/workflows/wine1118-native-wow64.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential flex bison mingw-w64 \
            libfreetype6-dev libfontconfig1-dev \
            libx11-dev libxext-dev libxrender-dev libxrandr-dev \
            libxcursor-dev libxi-dev libxinerama-dev libxxf86vm-dev \
            libgl-dev libegl-dev libvulkan-dev \
            libasound2-dev libpulse-dev libdbus-1-dev libgnutls28-dev \
            libjpeg-dev libpng-dev libtiff-dev libxml2-dev libxslt1-dev \
            libunwind-dev xauth xvfb zstd

      - name: Fetch Wine 11.18 and Wine Staging 11.18
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 4 -o wine-11.18.tar.xz \
            https://dl.winehq.org/wine/source/11.x/wine-11.18.tar.xz
          curl -fL --retry 4 -o wine-staging-11.18.tar.gz \
            https://github.com/wine-staging/wine-staging/archive/refs/tags/v11.18.tar.gz
          tar -xf wine-11.18.tar.xz
          tar -xf wine-staging-11.18.tar.gz
          test -x wine-staging-11.18/staging/patchinstall.py
          test "$(cat wine-staging-11.18/staging/VERSION)" = "Wine Staging 11.18"

      - name: Apply Wine Staging patches
        shell: bash
        run: |
          set -euo pipefail
          python3 wine-staging-11.18/staging/patchinstall.py \
            DESTDIR="$GITHUB_WORKSPACE/wine-11.18" --all

      - name: Configure native WoW64
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build package
          cd build
          "$GITHUB_WORKSPACE/wine-11.18/configure" \
            --enable-archs=i386,x86_64 \
            --disable-tests \
            --without-cups \
            --without-gphoto \
            --without-sane \
            --without-oss \
            --without-opencl \
            --without-wayland \
            --prefix="$GITHUB_WORKSPACE/package/wine-11.18-staging-native-wow64" \
            > configure.log 2>&1
          grep -E 'enable-archs|i386|x86_64|OpenGL|X11' configure.log | tail -120 || true

      - name: Build and install
        shell: bash
        run: |
          set -euo pipefail
          make -C build -j2
          make -C build install

      - name: Verify 32-bit new WoW64 execution
        shell: bash
        run: |
          set -euo pipefail
          W="$GITHUB_WORKSPACE/package/wine-11.18-staging-native-wow64"
          test -x "$W/bin/wine"
          test -x "$W/bin/wineserver"
          test -f "$W/lib/wine/i386-windows/ntdll.dll"
          test -f "$W/lib/wine/x86_64-windows/ntdll.dll"
          test -f "$W/lib/wine/x86_64-unix/ntdll.so"
          file "$W/lib/wine/i386-windows/ntdll.dll"
          file "$W/lib/wine/x86_64-unix/ntdll.so"
          "$W/bin/wine" --version | tee wine-version.txt

          mkdir -p "$RUNNER_TEMP/wow64-prefix"
          Xvfb :99 -screen 0 800x600x24 -nolisten tcp >xvfb.log 2>&1 &
          XVFB_PID=$!
          trap 'kill "$XVFB_PID" 2>/dev/null || true' EXIT
          export DISPLAY=:99
          for _ in $(seq 1 50); do
            xdpyinfo -display :99 >/dev/null 2>&1 && break
            sleep 0.1
          done
          export WINEPREFIX="$RUNNER_TEMP/wow64-prefix"
          export WINEARCH=wow64
          export WINEDEBUG=-all
          export WINEDLLOVERRIDES='mscoree,mshtml,winegstreamer='
          "$W/bin/wineboot" -u
          for _ in $(seq 1 100); do
            [[ -f "$WINEPREFIX/system.reg" ]] && break
            sleep 0.1
          done
          test -f "$WINEPREFIX/system.reg"

          "$W/bin/wine" "$W/lib/wine/i386-windows/cmd.exe" /c echo NATIVE_WOW64_I386_OK | tee i386-cmd.txt
          grep -q NATIVE_WOW64_I386_OK i386-cmd.txt

          cat > hello.c <<'C'
          #include <windows.h>
          #include <stdio.h>
          int main(void) { puts("PE32_HELLO_OK"); return 0; }
          C
          i686-w64-mingw32-gcc -O2 -s hello.c -o hello32.exe
          file hello32.exe | grep -q 'PE32 executable'
          "$W/bin/wine" "$GITHUB_WORKSPACE/hello32.exe" | tee hello32.txt
          grep -q PE32_HELLO_OK hello32.txt
          "$W/bin/wineserver" -k || true
          echo native_wow64_selftest=PASS

      - name: Package runtime and split
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p transfer
          tar --zstd -cf transfer/wine-11.18-staging-native-wow64.tar.zst \
            -C package wine-11.18-staging-native-wow64
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          src=Path('transfer/wine-11.18-staging-native-wow64.tar.zst')
          chunk=160*1024*1024
          whole=hashlib.sha256()
          parts=[]
          with src.open('rb') as f:
              i=0
              while True:
                  data=f.read(chunk)
                  if not data:
                      break
                  whole.update(data)
                  name=f'payload.part.{i:03d}'
                  path=Path('transfer')/name
                  path.write_bytes(data)
                  parts.append({'index':i,'name':name,'size':len(data),'sha256':hashlib.sha256(data).hexdigest()})
                  i += 1
          manifest={
              'schema_version':1,
              'logical_name':src.name,
              'logical_size':src.stat().st_size,
              'logical_sha256':whole.hexdigest(),
              'wine_version':'11.18-staging',
              'mode':'native-new-wow64',
              'configure':'--enable-archs=i386,x86_64',
              'selftest':'PASS',
              'parts':parts,
          }
          Path('transfer/manifest.json').write_text(json.dumps(manifest,indent=2)+'\n')
          print(json.dumps(manifest,indent=2))
          assert 1 <= len(parts) <= 6, len(parts)
          PY
          rm transfer/wine-11.18-staging-native-wow64.tar.zst

      - uses: actions/upload-artifact@v4
        if: ${{ hashFiles('transfer/payload.part.000') != '' }}
        with:
          name: wine-native-wow64-part-000
          path: |
            transfer/payload.part.000
            transfer/manifest.json
          compression-level: 0
          retention-days: 7

      - uses: actions/upload-artifact@v4
        if: ${{ hashFiles('transfer/payload.part.001') != '' }}
        with:
          name: wine-native-wow64-part-001
          path: |
            transfer/payload.part.001
            transfer/manifest.json
          compression-level: 0
          retention-days: 7

      - uses: actions/upload-artifact@v4
        if: ${{ hashFiles('transfer/payload.part.002') != '' }}
        with:
          name: wine-native-wow64-part-002
          path: |
            transfer/payload.part.002
            transfer/manifest.json
          compression-level: 0
          retention-days: 7

      - uses: actions/upload-artifact@v4
        if: ${{ hashFiles('transfer/payload.part.003') != '' }}
        with:
          name: wine-native-wow64-part-003
          path: |
            transfer/payload.part.003
            transfer/manifest.json
          compression-level: 0
          retention-days: 7

      - uses: actions/upload-artifact@v4
        if: ${{ hashFiles('transfer/payload.part.004') != '' }}
        with:
          name: wine-native-wow64-part-004
          path: |
            transfer/payload.part.004
            transfer/manifest.json
          compression-level: 0
          retention-days: 7

      - uses: actions/upload-artifact@v4
        if: ${{ hashFiles('transfer/payload.part.005') != '' }}
        with:
          name: wine-native-wow64-part-005
          path: |
            transfer/payload.part.005
            transfer/manifest.json
          compression-level: 0
          retention-days: 7
