name: Build qemu32 authserver timeout repair

on:
  push:
    branches:
      - repair/auth-timeout-qemu32-60s-20261002
    paths:
      - '.github/workflows/build-authserver-qemu32-timeout60.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Load pins
        shell: bash
        run: cat manifests/portable-runtime.env >> "$GITHUB_ENV"

      - name: Install build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -yq ninja-build ccache libboost-dev libboost-filesystem-dev libboost-locale-dev libboost-program-options-dev libboost-regex-dev libboost-thread-dev libssl-dev libreadline-dev zlib1g-dev libbz2-dev patchelf

      - name: Checkout exact TrinityCore revision
        uses: actions/checkout@v7
        with:
          repository: TrinityCore/TrinityCore
          ref: ${{ env.TRINITY_COMMIT }}
          path: upstream
          fetch-depth: 1

      - name: Patch only pre-auth session timeout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C upstream rev-parse HEAD)" = "$TRINITY_COMMIT"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('upstream/src/server/authserver/Server/AuthSession.cpp')
          s=p.read_text()
          old='                _timeout.expires_after(10s);'
          new='                _timeout.expires_after(60s); // qemu32 WoW 3.3.5 version proof can exceed 10 seconds'
          assert s.count(old) == 1, s.count(old)
          p.write_text(s.replace(old,new,1))
          PY
          grep -F '_timeout.expires_after(60s);' upstream/src/server/authserver/Server/AuthSession.cpp
          git -C upstream diff --check
          git -C upstream diff -- src/server/authserver/Server/AuthSession.cpp | tee auth-timeout.patch
          sha256sum auth-timeout.patch > auth-timeout.patch.sha256

      - name: Configure
        shell: bash
        run: |
          cmake -GNinja -S upstream -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DSERVERS=1 -DTOOLS=0 -DSCRIPTS=static \
            -DUSE_COREPCH=1 -DUSE_SCRIPTPCH=1

      - name: Build authserver only
        shell: bash
        run: |
          set -euo pipefail
          cmake --build build --target authserver --parallel 2
          auth="$(find build -type f -name authserver -perm -111 -print -quit)"
          test -n "$auth"
          mkdir -p artifact
          cp -a "$auth" artifact/authserver
          patchelf --set-rpath '$ORIGIN/../lib' artifact/authserver
          artifact/authserver --version | tee artifact/authserver.version.txt
          file artifact/authserver | tee artifact/authserver.file.txt
          sha256sum artifact/authserver > artifact/authserver.sha256
          cp auth-timeout.patch auth-timeout.patch.sha256 artifact/
          {
            echo "TRINITY_COMMIT=$TRINITY_COMMIT"
            echo "PATCH=AuthSession default pre-auth timeout 10s -> 60s"
            echo "PURPOSE=qemu32 WoW 3.3.5 version-proof latency"
          } > artifact/AUTH-TIMEOUT-REPAIR.env

      - uses: actions/upload-artifact@v6
        with:
          name: authserver-qemu32-timeout60
          path: artifact/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
